name: Smoke test

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bring up sdk_demo_backend
        run: |
          git clone https://github.com/widgrensit/sdk_demo_backend
          cd sdk_demo_backend && docker compose up -d

      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          mv Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Warm class cache
        run: godot --headless --path . --import || true

      - name: Run smoke test
        env:
          ASOBI_URL: http://localhost:8084
        run: godot --headless --path . -s smoke_tests/smoke.gd

      - name: Backend logs on failure
        if: failure()
        working-directory: sdk_demo_backend
        run: docker compose logs

      - name: Stop backend
        if: always()
        working-directory: sdk_demo_backend
        run: docker compose down -v
