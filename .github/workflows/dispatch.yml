name: Dispatch test

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip
          mv Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Warm class cache
        run: godot --headless --path . --import || true

      - name: Run dispatch test
        run: godot --headless --path . -s test/test_dispatch.gd

      - name: Run auth test
        run: godot --headless --path . -s test/test_auth.gd

      - name: Run device test
        run: godot --headless --path . -s test/test_device.gd

      - name: Run players test
        run: godot --headless --path . -s test/test_players.gd

      - name: Run outgoing-frame test
        run: godot --headless --path . -s test/test_outgoing_frames.gd
